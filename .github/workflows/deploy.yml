# Test en bouwt de site, zet hem online op Azure Static Web Apps en maakt zo nodig een release.
# Een pull request naar main komt op een eigen preview-adres. Dat adres is openbaar en verdwijnt
# als de pull request dicht gaat.
name: Online zetten

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Eén run tegelijk per pull request, en op main. Anders kan een preview die nog wordt neergezet,
# opnieuw verschijnen nadat de pull request dicht is en de preview is opgeruimd.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Een pull request uit een fork krijgt het deploy-token niet, dus die zetten we niet online.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Zo zet Azure het preview-adres als reactie bij de pull request.
      pull-requests: write
      # Inloggen bij Azure met OIDC, zonder geheim. Zie scripts/azure-tellers.ps1.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # De functie /api/tel is er één voor de site en alle previews. Alleen main zet die online, en
      # vóór de site, zodat de functie een nieuwe soort tel al kent als de site die stuurt.
      - if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: github.event_name != 'pull_request'
        run: npm install --omit=dev --prefix dist-api
      - if: github.event_name != 'pull_request'
        uses: Azure/functions-action@v1
        with:
          app-name: func-we-wiskundefit-prd
          package: dist-api
          sku: flexconsumption
      - id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
      # Wacht tot de nieuwe versie online staat en vergelijk dan elke pagina met dist/. Ook de 404,
      # de doorverwijzingen en de cache moeten kloppen met staticwebapp.config.json.
      - name: Controleer dat de site online klopt met dist/
        env:
          SITE: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.static_web_app_url || 'https://wiskundefit.nl' }}
        run: node scripts/controleer-site.js "$SITE"

  close:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close

  release:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Maak een release als deze versie er nog geen heeft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag heeft al een release."
            exit 0
          fi
          node scripts/release-notes.js > "$RUNNER_TEMP/notities.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notities.md"
